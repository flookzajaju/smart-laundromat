<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>สมัครสมาชิก</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #E1F5EE 0%, #f5f5f5 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .card {
            background: white; border-radius: 16px;
            padding: 2.5rem; width: 360px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .logo {
            text-align: center; margin-bottom: 2rem;
        }
        .logo h1 {
            font-size: 20px; font-weight: 500;
            color: #1D9E75; margin-top: 8px;
        }
        .logo p { font-size: 13px; color: #888; margin-top: 4px; }

        label {
            display: block; font-size: 13px;
            color: #555; margin-bottom: 6px;
        }
        input {
            width: 100%; padding: 10px 14px;
            border: 1px solid #e0e0e0; border-radius: 8px;
            font-size: 14px; margin-bottom: 1rem;
            transition: border-color 0.2s; outline: none;
        }
        input:focus { border-color: #1D9E75; }

        .hint {
            font-size: 12px; color: #aaa;
            margin-top: -10px; margin-bottom: 1rem;
        }

        .btn {
            width: 100%; padding: 12px;
            background: #1D9E75; color: white;
            border: none; border-radius: 8px;
            font-size: 15px; cursor: pointer;
            font-weight: 500; transition: background 0.2s;
        }
        .btn:hover { background: #0F6E56; }

        .alert {
            padding: 10px 14px; border-radius: 8px;
            font-size: 13px; margin-bottom: 1rem;
            text-align: center;
        }
        .alert-error { background: #FCEBEB; color: #A32D2D; }

        .divider {
            text-align: center; font-size: 13px;
            color: #aaa; margin: 1.25rem 0;
        }
        .link-btn {
            display: block; width: 100%; padding: 11px;
            border: 1.5px solid #e0e0e0; color: #555;
            border-radius: 8px; font-size: 14px;
            text-align: center; text-decoration: none;
            transition: all 0.2s;
        }
        .link-btn:hover { border-color: #1D9E75; color: #1D9E75; }

        .password-strength {
            height: 4px; border-radius: 2px;
            background: #f0f0f0; margin-top: -10px;
            margin-bottom: 1rem; overflow: hidden;
        }
        .strength-bar {
            height: 100%; border-radius: 2px;
            transition: width 0.3s, background 0.3s;
            width: 0%;
        }
    </style>
</head>
<body>
<div class="card">

    <div class="logo">
        <div style="font-size:36px;">🧺</div>
        <h1>สมัครสมาชิก</h1>
        <p>Smart Laundromat</p>
    </div>

    <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}"></span>
    </div>

    <form method="post" th:action="@{/register}" onsubmit="return validate()">

        <label>Username</label>
        <input type="text" name="username" id="username"
               placeholder="อย่างน้อย 4 ตัวอักษร"
               required minlength="4"/>
        <p class="hint">ใช้ตัวอักษรภาษาอังกฤษหรือตัวเลข</p>

        <label>Password</label>
        <input type="password" name="password" id="password"
               placeholder="อย่างน้อย 6 ตัวอักษร"
               required minlength="6"
               oninput="checkStrength(this.value)"/>
        <div class="password-strength">
            <div class="strength-bar" id="strength-bar"></div>
        </div>

        <label>ยืนยัน Password</label>
        <input type="password" id="confirm"
               placeholder="กรอก password อีกครั้ง" required/>

        <div id="match-error"
             style="color:#A32D2D; font-size:12px;
                    margin-top:-10px; margin-bottom:1rem; display:none;">
            password ไม่ตรงกัน
        </div>

        <button type="submit" class="btn">สมัครสมาชิก</button>
    </form>

    <div class="divider">มีบัญชีแล้ว?</div>

    <a href="/login" class="link-btn">เข้าสู่ระบบ</a>

</div>

<script>
    function checkStrength(val) {
        const bar = document.getElementById('strength-bar');
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 10) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        const colors = ['#E24B4A', '#BA7517', '#BA7517', '#1D9E75', '#0F6E56'];
        const widths = ['20%', '40%', '60%', '80%', '100%'];
        bar.style.width = score > 0 ? widths[score - 1] : '0%';
        bar.style.background = score > 0 ? colors[score - 1] : '';
    }

    function validate() {
        const pw = document.getElementById('password').value;
        const cf = document.getElementById('confirm').value;
        const err = document.getElementById('match-error');
        if (pw !== cf) {
            err.style.display = 'block';
            return false;
        }
        err.style.display = 'none';
        return true;
    }
</script>

</body>
</html>
